<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · yazdaninfo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bc: #00ff88;
      --bg-primary: #0a0a0a;
      --bg-card: rgba(255,255,255,.05);
      --border-color: rgba(255,255,255,.12);
      --text-primary: rgba(255,255,255,.85);
      --text-secondary: rgba(255,255,255,.4);
      --text-muted: rgba(255,255,255,.18);
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle animated gradient overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0a0a0a 80%);
      z-index: 0;
      opacity: 0.6;
    }

    /* particle / noise texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.3;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 880px;
      width: 100%;
      background: rgba(20,8,8,.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.04);
      transition: all 0.2s;
      text-align: center;
    }

    /* profile tag - matching site style */
    .profile-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-card);
      padding: 0.45rem 1.2rem 0.45rem 1rem;
      border-radius: 60px;
      border: 1px solid var(--border-color);
      margin-bottom: 2rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      backdrop-filter: blur(2px);
    }
    .profile-tag i {
      color: var(--bc);
      font-size: 1rem;
    }
    .profile-tag span {
      color: var(--text-primary);
      font-weight: 600;
      margin-left: 0.2rem;
    }

    /* 404 main — using site's neon green accent */
    .error-code {
      font-size: 9rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--bc), #66ffbb, var(--bc));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientShift 4s ease-in-out infinite alternate;
      letter-spacing: -6px;
      margin-bottom: 0.25rem;
      text-shadow: 0 0 40px rgba(0,255,136,0.15);
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .sub-message {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }
    .sub-message i {
      color: var(--bc);
      margin: 0 0.4rem;
    }

    .description {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0.5rem auto 2rem;
      line-height: 1.6;
      border-left: 3px solid var(--bc);
      padding-left: 1.2rem;
      text-align: left;
    }
    .description strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* social links - matching card style from site */
    .social-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.75rem 1.2rem;
      margin: 2.2rem 0 2rem;
      padding: 1rem 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }
    .social-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      transition: all 0.25s ease;
      background: rgba(255,255,255,.02);
      border: 1px solid transparent;
    }
    .social-item i {
      font-size: 1.1rem;
      width: 1.4rem;
      text-align: center;
      color: rgba(255,255,255,.3);
      transition: color 0.25s ease;
    }
    .social-item:hover {
      background: var(--bg-card);
      border-color: var(--border-color);
      color: var(--text-primary);
      transform: translateY(-1px);
    }
    .social-item:hover i {
      color: var(--bc);
    }
    .social-item .handle {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: rgba(255,255,255,.3);
      font-weight: 400;
      margin-left: 0.1rem;
      transition: color 0.25s ease;
    }
    .social-item:hover .handle {
      color: rgba(255,255,255,.6);
    }

    .action-button {
      display: inline-block;
      background: rgba(0,255,136,.15);
      color: var(--bc);
      font-weight: 600;
      padding: 0.85rem 2.6rem;
      border-radius: 60px;
      text-decoration: none;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
      border: 1px solid rgba(0,255,136,.2);
      transition: all 0.25s ease;
      box-shadow: 0 8px 18px -8px rgba(0,255,136,0.15);
      margin-top: 0.5rem;
    }
    .action-button i {
      margin-right: 0.5rem;
    }
    .action-button:hover {
      background: rgba(0,255,136,.25);
      border-color: var(--bc);
      transform: scale(1.02);
      box-shadow: 0 12px 28px -10px rgba(0,255,136,0.25);
      color: var(--bc);
    }

    /* projects mini - matching site card style */
    .project-hint {
      margin-top: 2.2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem 1.8rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .project-hint span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,.02);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      border: 1px solid var(--border-color);
      transition: border-color .25s ease;
    }
    .project-hint span:hover {
      border-color: rgba(0,255,136,.2);
    }
    .project-hint i {
      color: var(--bc);
      font-size: 0.7rem;
      opacity: 0.7;
    }

    /* footer - matching site */
    .footer-note {
      margin-top: 1.8rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.6rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 1.2rem;
    }
    .footer-note i {
      margin-right: 0.4rem;
      color: var(--bc);
    }
    .footer-note .neon {
      color: rgba(0,255,136,.55);
    }

    @media (max-width: 600px) {
      .container { padding: 2rem 1.2rem; }
      .error-code { font-size: 6rem; letter-spacing: -3px; }
      .sub-message { font-size: 1.4rem; }
      .description { font-size: 0.95rem; padding-left: 0.8rem; }
      .social-links { gap: 0.5rem; }
      .social-item { font-size: 0.85rem; padding: 0.2rem 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-tag">
      <i class="fas fa-code"></i> Yazdan Khodaifar <span>·</span> <i class="fas fa-terminal"></i> 404
    </div>

    <div class="error-code">404</div>
    <div class="sub-message">
      <i class="fas fa-compass"></i> lost in the matrix <i class="fas fa-ghost"></i>
    </div>
    <div class="description">
      <strong>Oops!</strong> The page you're looking for doesn't exist, or has been moved.
      But hey, even developers get lost
    </div>

    <div class="social-links">
      <a href="#" class="social-item" aria-label="GitHub yazdaninfo">
        <i class="fab fa-github"></i> <span class="handle">@yazdaninfo</span>
      </a>
      <a href="#" class="social-item" aria-label="GitHub yazdan000gamer">
        <i class="fab fa-github"></i> <span class="handle">@yazdan000gamer</span>
      </a>
      <a href="#" class="social-item" aria-label="Telegram">
        <i class="fab fa-telegram-plane"></i> <span class="handle">@CoYazdan</span>

      <a href="#" class="social-item" aria-label="Instagram">
        <i class="fab fa-instagram"></i> <span class="handle">@CoYazdan</span>

      <a href="#" class="social-item" aria-label="Xbox">
        <i class="fab fa-xbox"></i> <span class="handle">@yazdan000gamer</span>

      <a href="#" class="social-item" aria-label="Soroush Plus">

    <a href="#" class="action-button">
      <i class="fas fa-arrow-left"></i> take me home
    </a>

    <div class="project-hint">
      <span><i class="fas fa-lock"></i> Encoder</span>
      <span><i class="fas fa-robot"></i> McAfk</span>

    </div>

    <div class="footer-note">
      <span class="neon">@yazdaninfo</span>
    </div>
  </div>

  <script>
    (function() {
      const el = document.querySelector('.error-code');
      if (!el) return;
      const originalText = el.textContent;
      let interval = null;

      function glitch() {
        const chars = '!@#$%^&*()_+{}|:<>?~0123456789';
        let result = '';
        for (let i = 0; i < originalText.length; i++) {
          if (Math.random() > 0.7) {
            result += chars[Math.floor(Math.random() * chars.length)];
          } else {
            result += originalText[i];
          }
        }
        el.textContent = result;
      }

      function startGlitch() {
        if (interval) clearInterval(interval);
        interval = setInterval(() => {
          if (Math.random() > 0.55) {
            glitch();
            setTimeout(() => {
              el.textContent = originalText;
            }, 80);
          }
        }, 1800);
      }

      function stopGlitch() {
        if (interval) {
          clearInterval(interval);
          interval = null;
          el.textContent = originalText;
        }
      }

      el.addEventListener('mouseenter', startGlitch);
      el.addEventListener('mouseleave', stopGlitch);
      setTimeout(startGlitch, 600);
    })();
  </script>
</body>
</html>
