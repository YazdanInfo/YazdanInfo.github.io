<style>
  :root{
    --bg:#0b0d10; --panel:#15181d; --panel2:#1b1f26; --border:#2a2f38; --border-soft:#20252c;
    --text:#eef1f5; --muted:#9aa3ae;
    --amber:#f5a623; --sky:#38bdf8; --coral:#fb7185; --mono:#7dd3fc;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--amber);text-decoration:none;transition:color .15s ease}
  a:hover{color:#ffc861}
  ::selection{background:#f5a62333;color:var(--text)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#3a414f}
  code{font-family:'JetBrains Mono',monospace;background:#0e0f12;border:1px solid var(--border-soft);
    padding:2px 7px;border-radius:5px;font-size:13px;color:var(--mono)}
  pre{font-family:'JetBrains Mono',monospace;background:#0e0f12;border:1px solid var(--border-soft);
    padding:13px 15px;border-radius:9px;font-size:13px;color:var(--mono);overflow-x:auto;margin:10px 0 0}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-soft)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;
    border:1px solid var(--border-soft);background:var(--panel);font-size:13px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .card{border:1px solid var(--border);background:var(--panel);border-radius:14px;overflow:hidden;
    transition:border-color .15s ease, transform .15s ease}
  .card:hover{border-color:#3a414f}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:10px;
    font-weight:600;font-size:14px;border:1px solid transparent;transition:filter .15s ease, transform .1s ease}
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(90deg,var(--amber),#ffcb66);color:#1f1404;
    box-shadow:0 4px 18px -6px rgba(245,166,35,0.45)}
  .btn-secondary{background:var(--panel2);color:var(--text);border-color:var(--border-soft)}
  section h2{position:relative;padding-left:14px}
  section h2::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;
    border-radius:3px;background:linear-gradient(var(--amber),var(--sky))}
  .shot{display:block;width:100%;height:auto;border-bottom:1px solid var(--border)}
  .shot-caption{padding:13px 16px;font-size:13px;color:var(--muted)}
  h1,h2,h3{margin:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}

  .layout{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);flex:none;border-right:1px solid var(--border-soft);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:4px}
  .sidebar .logo{display:flex;align-items:center;gap:9px;padding:0 8px 18px;font-weight:800;font-size:17px}
  .sidebar a{display:block;color:var(--muted);font-size:14px;padding:9px 10px;border-radius:8px}
  .sidebar a:hover{background:var(--panel);color:var(--text)}
  .sidebar a.active{background:var(--panel2);color:var(--amber)}
  .main{flex:1;min-width:0;max-width:820px;margin:0 auto;padding:40px 32px 80px}
  .mobilebar{display:none;position:sticky;top:0;z-index:5;background:rgba(11,13,16,0.92);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--border-soft);padding:12px 18px;
    align-items:center;gap:10px;font-weight:700}
  @media (max-width:860px){
    .sidebar{display:none}
    .mobilebar{display:flex}
    .main{max-width:100%}
  }
  section{scroll-margin-top:16px;margin-bottom:48px}
  .cmd-row{border-top:1px solid var(--border-soft);padding:16px 0}
  .cmd-row:first-child{border-top:none}
  .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:6px;background:#241e10;color:var(--amber);margin-left:8px}
  .icon-row{display:flex;align-items:center;gap:7px}
  .stat{display:flex;align-items:center;gap:6px}
</style>
</head>

function useActiveSection(ids: string[]) {
  const [active, setActive] = React.useState(ids[0]);
  React.useEffect(() => {
    const onScroll = () => {
      let current = ids[0];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < 140) current = id;
      }
      setActive(current);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return active;
}

function useRepoStats() {
  const [stats, setStats] = React.useState<{ stars: number; forks: number; issues: number; license: string } | null>(null);
  React.useEffect(() => {
    let cancelled = false;
    fetch(REPO_API).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => {
      if (cancelled) return;
      setStats({
        stars: d.stargazers_count, forks: d.forks_count,
        issues: d.open_issues_count, license: d.license?.spdx_id || "MIT",
      });
    }).catch(() => { /* keep null -> fallback shown */ });
    return () => { cancelled = true; };
  }, []);
  return stats;
}
